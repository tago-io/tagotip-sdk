name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  rust:
    name: Rust (codec + ffi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --exclude tagotip-python

      - name: Clippy (tagotip-secure, all features)
        run: cargo clippy -p tagotip-secure --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude tagotip-python

      - name: Test crypto (all cipher suites)
        run: cargo test -p tagotip-secure --all-features

  node:
    name: Node.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: tagotip-node
        run: npm ci

      - name: Build
        working-directory: tagotip-node
        run: npm run build

      - name: Test
        working-directory: tagotip-node
        run: npm test

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Test
        working-directory: tagotip-go
        run: go test ./...

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.x"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        working-directory: tagotip-python
        run: uv sync --dev

      - name: Build and install
        working-directory: tagotip-python
        run: uv run maturin develop

      - name: Test
        working-directory: tagotip-python
        run: uv run pytest tests/

  arduino:
    name: Arduino (C test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run test
        working-directory: tagotip-arduino
        run: cc -o test_parse tests/test_parse.c -I src && ./test_parse

      - name: Build and run crypto test
        working-directory: tagotip-arduino
        run: cc -std=c99 -Wall -Wextra -Werror -o test_crypto tests/test_crypto.c src/tagotips.c -I src && ./test_crypto

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
